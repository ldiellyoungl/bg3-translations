contexts:
  - name: Ячейки заклинаний
    meta:
      "🌐 Wiki:": "[bg3.wiki](https://bg3.wiki/wiki/Resources#Spell_slots)"
      "🌐 Фендом:": "[baldursgate.fandom.com](https://baldursgate.fandom.com/ru/wiki/%D0%94%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%B8%D1%8F#%D0%A0%D0%B5%D1%81%D1%83%D1%80%D1%81%D1%8B)"
    terms:
      - name: Spell slot
        definition: |
          **Ячейка заклинания**  
          Ресурс, позволяющий использовать известные (и подготовленные) заклинания. 
          Восполнение: Долгий отдых
        aliases:
          - Ячейка заклинаний

      - name: Warlock Spell Slot
        definition: |
          **Ячейка заклинания колдуна**  
          Ресурс, доступный колдунам. Ячейки прогрессируют по силе, увеличиваясь на круг заклинания по мере повышения уровня класса. 
          Восполнение: Короткий отдых
        aliases:
          - Ячейка заклинания колдуна

      - name: Level 3 Shadow Spell Slot
        definition: |
          **Теневая ячейка заклинаний**  
          Бонусный ячейка 3-го уровня, который может получить главный Гейл. Вы можете использовать её для применения любых подготовленных заклинаний 3-го уровня (например, «Огненный шар») 
          Восполнение: Долгий отдых
        aliases:
          - Теневая ячейка заклинаний
