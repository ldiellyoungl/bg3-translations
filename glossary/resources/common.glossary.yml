contexts:
  - name: Основные ресурсы
    meta:
      "🌐 Wiki:": "[bg3.wiki](https://bg3.wiki/wiki/Resources#Common_resources)"
      "🌐 Фендом:": "[baldursgate.fandom.com](https://baldursgate.fandom.com/ru/wiki/%D0%94%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%B8%D1%8F#%D0%A0%D0%B5%D1%81%D1%83%D1%80%D1%81%D1%8B)"
    terms:
      - name: Action
        definition: |
          **Действие**  
          Базовый ресурс, использующийся почти что повсеместно.  
          Восполнение: Каждый ход
        aliases:
          - Действие

      - name: Bonus Action
        definition: |
          **Бонусное действие**  
          Дополнительный ресурс, использующийся в сражениях.
          Восполнение: Каждый ход
        aliases:
          - Бонусное действие

      - name: Reaction
        definition: |
          **Ответное действие**  
          Пассивное действие, позволяющее выполнить предустановленное действие (реакцию) не в ход персонажа. Может быть лишь одно ответное действие до следующего хода персонажа.
          Восполнение: Каждый ход
        aliases:
          - Ответное действие

      - name: Movement speed
        definition: |
          **Скорость**  
          Ресурс для использования некоторых действий, связанных с перемещением.
          Восполнение: Каждый ход
        aliases:
          - Скорость
