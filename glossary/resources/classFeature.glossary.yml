contexts:
  - name: Ячейки заклинаний
    meta:
      "🌐 Wiki:": "[bg3.wiki](https://bg3.wiki/wiki/Resources#Lists_of_class_feature_resources)"
      "🌐 Фендом:": "[baldursgate.fandom.com](https://baldursgate.fandom.com/ru/wiki/%D0%94%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%B8%D1%8F#%D0%A0%D0%B5%D1%81%D1%83%D1%80%D1%81%D1%8B)"
    terms:
      - name: Arcane Recovery Charges
        definition: |
          **Заряд восст. магии**  
          Позволяет классам и подклассам волшебников (всем связанным) восстанавливать вне боя израсходованные ячейки заклинаний. 
          Восполнение: Долгий отдых
        aliases:
          - Заряд восстановления магии

      - name: Bardic Inspirations
        definition: |
          **Заряд Бардовского вдохновения**  
          Ресурс барда. Позволяет применять навыки класса.
          Восполнение: Долгий отдых
        aliases:
          - Заряд Бардовского вдохновения

      - name: Natural Recovery Charges
        definition: |
          **Заряд природ. восстановления**  
          Позволяет классу друида восстанавливать часть израсходованных ячеек заклинаний.
          Восполнение: Короткий отдых
        aliases:
          - Заряд природного восстановления

      - name: Rage Charges
        definition: |
          **Ярость**  
          Ресурс варвара. Позволяет входить в состояние ярости, применяя Бонусное действие.
          Восполнение: Долгий отдых
        aliases:
          - Ярость

      - name: Sorcery Points
        definition: |
          **Очки чар**  
          Ресурс чародея. Позволяет применять навыки метамагии класса, или восполнять ячейки заклинаний.
          Восполнение: Долгий отдых
        aliases:
          - Очки чар

      - name: Superiority Dice
        definition: |
          **Кубик превосходства**  
          Ресурс для классов воина. Позволяет выполнять присущие воину действия и реакции.
          Восполнение: Короткий отдых
        aliases:
          - Кубик превосходства

      - name: Ki Points
        definition: |
          **Ци**  
          Ресурс монаха. Позволяет применять навыки класса.
          Восполнение: Короткий отдых
        aliases:
          - Ци

      - name: Lay on Hands Charges
        definition: |
          **Заряд возложения рук**  
          Ресурс паладина. Позволяет использовать чары возложения рук.
          Восполнение: Долгий отдых
        aliases:
          - Заряд возложения рук

      - name: Channel Oath Charges
        definition: |
          **Заряд силы клятвы**  
          Ресурс паладина. Позволяет использовать навыки класса.
          Восполнение: Долгий отдых
        aliases:
          - Заряд силы клятвы

      - name: Channel Divinity Charges
        definition: |
          **Заряд проведения энергии**  
          Ресурс, доступный классу жреца. Используется для применения некоторых уникальных для жрецов заклинаний.
          Восполнение: Долгий отдых
        aliases:
          - Заряд проведения энергии

      - name: Wild Shape Charges
        definition: |
          **Заряд дикого облика**  
          Ресурс, определяющий сколько раз класс друида может использовать превращение в животное (дикий облик).
          Восполнение: Короткий отдых
        aliases:
          - Заряд дикого облика
