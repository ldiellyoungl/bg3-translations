contexts:
  - name: Броски кубиков
    meta:
      "🌐 Wiki:": "[bg3.wiki](https://bg3.wiki/wiki/Dice_rolls)"
    terms:
      - name: Ability checks
        definition: |
          **Проверка характеристики**  
          Это броски кубиков, определяющие, преуспеет ли существо в выполнении задачи или потерпит неудачу. Они бросаются против сложности задачи (DC)
        aliases:
          - Проверка характеристики

      - name: Saving throws
        definition: |
          **Испытание**  
          Представляют собой попытку существа «спасти» себя от вреда.
        aliases:
          - Испытание

      - name: Attack roll
        definition: |
          **Бросок атаки**  
          Существа совершают броски атаки, когда атакуют цель, обычно оружием или заклинанием.
        aliases:
          - Бросок атаки

      - name: Critical hit
        definition: |
          **Критический удар**  
          Когда существо выбрасывает естественную 20 при броске атаки, атака считается критической.
        aliases:
          - Критический удар

      - name: Critical misses
        definition: |
          **Критический промах**  
          Когда существо выбрасывает естественную 1 при броске атаки, атака считается критическим промахом.
        aliases:
          - Критический промах

      - name: Armour Class
        definition: |
          **Класс брони**  
          Показатель того, насколько сложно поразить существо атакой. Для успешного попадания по существу результаты броска атаки должны быть равны или превышать класс брони цели.
        aliases:
          - Класс брони
          - КБ
          - AC

      - name: Difficulty Class
        definition: |
          **Класс сложности**  
          Класс сложности, против которого совершается бросок при попытке спасброска, называется DC.  
          Успешный спасбросок может означать полное избегание негативных эффектов, уменьшение получаемого урона (обычно вдвое) или и то, и другое.
        aliases:
          - Класс сложности
          - КС
          - DC
