contexts:
  - name: Основные характеристики
    meta:
      "🌐 Wiki:": "[bg3.wiki](https://bg3.wiki/wiki/Abilities)"
      "🌐 Фендом:": "[baldursgate.fandom.com](https://baldursgate.fandom.com/ru/wiki/%D0%9D%D0%B0%D0%B2%D1%8B%D0%BA%D0%B8_(Baldur%27s_Gate_III))"
    terms:
      - name: Strength
        definition: |
          **Сила**  
          Это показатель характеристики и основная характеристика Варвара, Воина и Паладина.  
          Сила влияет на ваш навык «Атлетика» и броски атаки, поэтому вы становитесь лучше в ближнем бою.  
          Она также определяет, как далеко вы можете прыгнуть, сколько можете унести и как далеко можете оттолкнуть (отчасти в зависимости от навыка «Атлетика»).
        aliases:
          - Сила
          - STR

      - name: Dexterity
        definition: |
          **Ловкость**  
          Это показатель характеристик и ключевая способность Разбойников, Рейнджеров, Монахов и других владельцев оружия с высокой точностью.  
          Ловкость влияет на ваши навыки «Атлетика», «Ловкости рук» и «Скрытности», а также на броски атаки при использовании дальнобойного и точного оружия. 
          Она также влияет на вашу Инициативу и Класс брони.
        aliases:
          - Ловкость
          - DEX

      - name: Constitution
        definition: |
          **Телосложение**  
          Телосложение влияет на максимальное количество очков здоровья и спасброски на концентрацию.  
          Ваш модификатор «Телосложения» добавляется к количеству очков здоровья, получаемых за уровень (включая отрицательные значения), и применяется задним числом.
        aliases:
          - Телосложение
          - CON

      - name: Intelligence
        definition: |
          **Интеллект**  
          это показатель характеристики и основная способность волшебников.  
          Интеллект влияет на ваши навыки «Магии», «Истории», «Расследования», «Природы» и «Религии».  
          Он также улучшает колдовство для волшебников, воинов (полезно для Рыцарей-колдунов) и разбойников (полезно для Магических Трикстеров), увеличивая вероятность попадания по врагу при бросках атаки заклинаниями из-за повышенной сложности заклинаний со спасбросками.  
          Кроме того, он увеличивает максимальное количество подготовленных заклинаний для волшебников.
        aliases:
          - Интеллект
          - INT

      - name: Wisdom
        definition: |
          **Мудрость**  
          это показатель характеристики, являющийся основной характеристикой жрецов и друидов.  
          Мудрость влияет на ваши навыки «обращения с животными», «проницательности», «медицины», «восприятия» и «выживания», а также улучшает заклинания для жрецов, друидов, монахов и рейнджеров (повышается вероятность попадания по врагам при бросках атаки заклинаниями; повышается сложность заклинаний при спасбросках).
        aliases:
          - Мудрость
          - WIS

      - name: Charisma
        definition: |
          **Харизма**  
          основная характеристика бардов, чернокнижников и волшебников.  
          Харизма влияет на связанные с ней навыки («Обман», «Запугивание», «Исполнение», «Убеждение») и улучшает заклинания для бардов, паладинов, чернокнижников и волшебников (повышается вероятность попадания по врагам при бросках атаки заклинаниями; повышается сложность заклинаний при спасбросках).
        aliases:
          - Харизма
          - CHA

      - name: Ability Modifier
        definition: |
          **Модификатор «характеристики»**  
          число, которое прибавляется к броску кубика (d20)
        aliases:
          - Модификатор
